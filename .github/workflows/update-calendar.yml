name: Update data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update the data
        run: python tools/update_all.py
      - name: Save what changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Automatic data update"
            git push
          fi
