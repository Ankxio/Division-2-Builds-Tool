<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Division 2 Build Planner</title>
  <meta name="description" content="Plan and share builds for The Division 2: weapons, gear, set bonuses, damage and time to kill.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Division 2 Build Planner</h1>
      <p id="data-info" class="meta">Loading game data…</p>
    </div>
    <div class="toolbar">
      <button data-action="share" class="primary">Copy build link</button>
      <button data-action="reset">New build</button>
      <span class="sep"></span>
      <input id="save-name" type="text" placeholder="Build name" aria-label="Build name">
      <button data-action="save">Save</button>
      <select id="saved" aria-label="Saved builds"></select>
      <button data-action="load">Load</button>
      <button data-action="remove">Delete</button>
    </div>
  </header>

  <main>
    <div id="builder"></div>
    <aside id="results"></aside>
  </main>

  <footer class="meta">
    Fan-made tool. Not affiliated with Ubisoft. Numbers are estimates based on the data loaded above.
  </footer>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
