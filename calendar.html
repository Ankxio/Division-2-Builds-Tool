<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Division 2 Seasonal Calendar</title>
  <meta name="description" content="What is live, what is next and what has ended in The Division 2: seasons, events and countdowns.">
  <meta name="theme-color" content="#0a0c0f">
  <script>
    // Animations: the visitor's own choice if they made one, otherwise their system setting.
    (function () {
      var choice = null;
      try { choice = localStorage.getItem('d2.motion'); } catch (e) {}
      var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.documentElement.dataset.motion = choice === 'on' || choice === 'off' ? choice : calm ? 'off' : 'on';
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
